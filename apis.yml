aid: fbn
url: https://raw.githubusercontent.com/api-evangelist/fbn/refs/heads/main/apis.yml
name: Farmers Business Network
kind: company
description: >-
  Farmers Business Network (FBN) is a direct-to-farmer ag platform combining a
  member network, e-commerce for crop inputs (seed, chemistry, animal health),
  agronomy and precision analytics, financing and crop insurance, and a
  sustainability / Scope-3 program (Gradable). FBN Analytics ingests precision
  data from 60+ monitor types and integrates with John Deere Operations Center
  and CNH AFS Connect to pull machine, planting, application, and harvest data
  into the FBN platform. FBN is a Field to Market Qualified Data Management
  Partner via the Fieldprint API. FBN does not publish a public developer
  portal; partner integrations are arranged directly.
